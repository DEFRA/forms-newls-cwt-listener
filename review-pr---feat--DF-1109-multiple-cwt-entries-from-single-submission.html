<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!--
  review-pr-enhanced — interactive PR review page template.

  This file is fully self-contained (no server, no external resources) and is
  driven entirely by the JSON document inside <script id="review-data">.
  To generate a review page: copy this file, replace the contents of that
  script tag with the real review data, and set the <title>. Nothing else
  needs to change.

  Additional syntax definitions can be loaded by adding, after the runtime
  script, a script that calls:  ReviewPage.registerLanguage(name, definition)
  (see the LANGUAGES section below for the definition shape).
-->
<title>PR Review</title>
<style>
:root {
  --bg: #f6f8fa; --panel: #ffffff; --border: #d0d7de; --text: #1f2328;
  --muted: #656d76; --accent: #0969da; --accent-soft: #ddf4ff;
  --code-bg: #ffffff; --code-gutter: #f6f8fa; --gutter-text: #8c959f;
  --added-bg: #e6ffec; --added-num: #ccffd8;
  --removed-bg: #ffebe9; --removed-num: #ffd7d5;
  --modified-bg: #fff8c5; --modified-num: #fae17d;
  --seg-ins: #abf2bc; --seg-del: #ffc0c0;
  --tick: #1a7f37; --cross: #cf222e;
  --sev-critical: #cf222e; --sev-major: #bc4c00; --sev-minor: #9a6700;
  --sev-suggestion: #0969da; --sev-info: #57606a;
  --tok-kw: #cf222e; --tok-str: #0a3069; --tok-num: #0550ae; --tok-com: #6e7781;
  --tok-fn: #8250df; --tok-type: #953800; --tok-lit: #0550ae; --tok-key: #116329;
  --shadow: 0 3px 12px rgba(31,35,40,.12);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0d1117; --panel: #161b22; --border: #30363d; --text: #e6edf3;
    --muted: #8d96a0; --accent: #4493f8; --accent-soft: #121d2f;
    --code-bg: #0d1117; --code-gutter: #161b22; --gutter-text: #6e7681;
    --added-bg: #12261e; --added-num: #1b4332;
    --removed-bg: #25171c; --removed-num: #542426;
    --modified-bg: #272115; --modified-num: #5c4a1a;
    --seg-ins: #1f6f43; --seg-del: #8b3a3f;
    --tick: #3fb950; --cross: #f85149;
    --sev-critical: #f85149; --sev-major: #db6d28; --sev-minor: #d29922;
    --sev-suggestion: #4493f8; --sev-info: #8d96a0;
    --tok-kw: #ff7b72; --tok-str: #a5d6ff; --tok-num: #79c0ff; --tok-com: #8b949e;
    --tok-fn: #d2a8ff; --tok-type: #ffa657; --tok-lit: #79c0ff; --tok-key: #7ee787;
    --shadow: 0 3px 12px rgba(0,0,0,.5);
  }
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font: 15px/1.55 -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}
code, pre, .cb-table, .ln-num { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }
a { color: var(--accent); }
h1 { font-size: 1.35rem; margin: 0; }
h2 { font-size: 1.15rem; border-bottom: 1px solid var(--border); padding-bottom: .35rem; margin-top: 2.2rem; }
h3 { font-size: 1rem; margin: 1.2rem 0 .5rem; }
p { margin: .5rem 0; }
button { font: inherit; cursor: pointer; }

/* ---------- page chrome ---------- */
.page-header {
  position: sticky; top: 0; z-index: 40; background: var(--panel);
  border-bottom: 1px solid var(--border); padding: .65rem 1.2rem .0rem;
  box-shadow: 0 1px 4px rgba(31,35,40,.06);
}
.ph-row { display: flex; flex-wrap: wrap; align-items: center; gap: .8rem; }
.ph-meta { color: var(--muted); font-size: .82rem; }
.ph-meta code { background: var(--bg); border: 1px solid var(--border); border-radius: 4px; padding: 0 .3em; }
.ph-actions { margin-left: auto; display: flex; align-items: center; gap: .5rem; }
.btn {
  background: var(--panel); border: 1px solid var(--border); border-radius: 6px;
  padding: .28rem .7rem; font-size: .82rem; color: var(--text);
}
.btn:hover { border-color: var(--accent); color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.primary:hover { filter: brightness(1.1); color: #fff; }
.progress-wrap { display: flex; align-items: center; gap: .5rem; font-size: .8rem; color: var(--muted); }
.progress-bar { width: 130px; height: 8px; border-radius: 4px; background: var(--bg); border: 1px solid var(--border); overflow: hidden; display: flex; }
.progress-tick { background: var(--tick); height: 100%; }
.progress-cross { background: var(--cross); height: 100%; }
.tabs { display: flex; gap: .25rem; margin-top: .55rem; }
.tab-btn {
  border: 1px solid transparent; border-bottom: none; background: none; color: var(--muted);
  padding: .45rem .9rem; border-radius: 8px 8px 0 0; font-size: .9rem;
}
.tab-btn[aria-selected="true"] {
  background: var(--bg); border-color: var(--border); color: var(--text); font-weight: 600;
}
main { max-width: 1080px; margin: 0 auto; padding: 1.2rem 1.2rem 4rem; }
.tab-panel[hidden] { display: none; }
.kbd-hint { font-size: .78rem; color: var(--muted); }
kbd {
  border: 1px solid var(--border); border-bottom-width: 2px; border-radius: 4px;
  padding: 0 .35em; font-size: .85em; background: var(--panel);
}
footer.page-footer { max-width: 1080px; margin: 0 auto; padding: 0 1.2rem 3rem; }

/* ---------- summary & file list ---------- */
.summary-card, .files-card {
  background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
  padding: 1rem 1.2rem; margin: 1rem 0;
}
.file-row {
  display: flex; align-items: baseline; gap: .6rem; padding: .32rem .2rem;
  border-top: 1px solid var(--border); font-size: .86rem;
}
.file-row:first-of-type { border-top: none; }
.file-status { flex: 0 0 4.6em; text-align: center; font-size: .72rem; font-weight: 600;
  border-radius: 10px; padding: .05rem 0; text-transform: uppercase; letter-spacing: .03em; }
.file-status.added    { color: var(--tick); background: var(--added-bg); }
.file-status.modified { color: var(--sev-minor); background: var(--modified-bg); }
.file-status.deleted  { color: var(--cross); background: var(--removed-bg); }
.file-status.renamed  { color: var(--accent); background: var(--accent-soft); }
.file-path { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: .82rem; word-break: break-all; }
a.file-path { text-decoration: none; }
a.file-path:hover { text-decoration: underline; }
.file-desc { color: var(--muted); flex: 1 1 14rem; }
.file-verdict { margin-left: auto; flex: 0 0 auto; }

/* ---------- tick / cross ---------- */
.verdict-group { display: inline-flex; gap: .25rem; }
.v-btn {
  border: 1px solid var(--border); background: var(--panel); border-radius: 6px;
  width: 1.8rem; height: 1.55rem; line-height: 1; font-size: .85rem; color: var(--muted);
}
.v-btn.tick.on  { background: var(--tick); border-color: var(--tick); color: #fff; }
.v-btn.cross.on { background: var(--cross); border-color: var(--cross); color: #fff; }
.v-btn:hover { border-color: var(--accent); }

/* ---------- walkthrough sections ---------- */
.wt-section { margin-top: 2.4rem; }
.wt-section > h2 { display: flex; align-items: center; gap: .7rem; }
.sec-progress { font-size: .72rem; font-weight: 400; color: var(--muted); border: 1px solid var(--border);
  border-radius: 10px; padding: .1rem .55rem; background: var(--panel); }
.wt-intro { max-width: 62rem; }

/* ---------- flow diagram ---------- */
.flow {
  display: flex; flex-wrap: wrap; align-items: center; gap: .35rem .15rem;
  background: var(--panel); border: 1px dashed var(--border); border-radius: 8px;
  padding: .7rem .9rem; margin: .8rem 0; font-size: .8rem;
}
.flow-node {
  border: 1px solid var(--border); border-radius: 6px; padding: .22rem .6rem;
  background: var(--bg); white-space: nowrap;
}
.flow-node .fn-note { display: block; font-size: .68rem; color: var(--muted); white-space: nowrap; }
.flow-node.entry    { border-radius: 999px; background: var(--accent-soft); border-color: var(--accent); }
.flow-node.changed  { border-color: var(--tick); background: var(--added-bg); font-weight: 600; }
.flow-node.decision { border-style: solid; border-width: 1px; transform: skewX(-8deg); background: var(--modified-bg); }
.flow-node.decision > * { transform: skewX(8deg); }
.flow-node.external { border-style: dashed; color: var(--muted); }
.flow-node.terminal { border-radius: 999px; }
.flow-arrow { color: var(--muted); padding: 0 .25rem; display: inline-flex; flex-direction: column; align-items: center; }
.flow-arrow .fa-label { font-size: .66rem; color: var(--muted); }

/* ---------- code block component ---------- */
.code-block {
  background: var(--code-bg); border: 1px solid var(--border); border-radius: 8px;
  margin: 1.1rem 0; overflow: hidden;
  content-visibility: auto; contain-intrinsic-size: auto 400px;
}
.cb-header {
  display: flex; flex-wrap: wrap; align-items: center; gap: .3rem .8rem;
  background: var(--code-gutter); border-bottom: 1px solid var(--border);
  padding: .45rem .8rem; font-size: .8rem;
}
.cb-file { font-family: ui-monospace, Menlo, Consolas, monospace; font-weight: 600; word-break: break-all; }
.cb-lang { color: var(--muted); border: 1px solid var(--border); border-radius: 10px; padding: 0 .5em; font-size: .7rem; }
.cb-actions { margin-left: auto; display: flex; align-items: center; gap: .45rem; }
.copy-link {
  background: none; border: none; color: var(--accent); font-size: .78rem; padding: 0;
  text-decoration: underline; text-underline-offset: 2px;
}
.copy-link.copied { color: var(--tick); text-decoration: none; }
.cb-note { padding: .55rem .9rem; font-size: .85rem; border-bottom: 1px solid var(--border); color: var(--muted); background: var(--panel); }
.cb-scroll { overflow-x: auto; }
.cb-table { border-collapse: collapse; width: 100%; font-size: .8rem; line-height: 1.5; }
.cb-table td { padding: 0; vertical-align: top; }
.ln-num {
  position: sticky; left: 0; width: 1%; min-width: 3.2em; padding: 0 .7em 0 .5em !important;
  text-align: right; color: var(--gutter-text); background: var(--code-gutter);
  user-select: none; border-right: 1px solid var(--border); white-space: nowrap;
}
.ln-act { width: 1.5em; text-align: center; user-select: none; }
.ln-add-comment {
  visibility: hidden; border: none; background: none; color: var(--accent);
  font-size: .8rem; padding: 0 .2em; line-height: 1.4;
}
tr.code-row:hover .ln-add-comment { visibility: visible; }
.ln-code { padding: 0 .9em 0 .35em !important; white-space: pre; }
tr.ln-added    { background: var(--added-bg); }
tr.ln-added    .ln-num { background: var(--added-num); color: var(--text); }
tr.ln-removed  { background: var(--removed-bg); }
tr.ln-removed  .ln-num { background: var(--removed-num); color: var(--text); font-style: italic; }
tr.ln-removed  .ln-code { text-decoration: line-through; text-decoration-color: color-mix(in srgb, var(--cross) 45%, transparent); }
tr.ln-modified { background: var(--modified-bg); }
tr.ln-modified .ln-num { background: var(--modified-num); color: var(--text); }
tr.flash { animation: flash-line 1.6s ease-out; }
@keyframes flash-line { 0% { background: var(--accent-soft); } 100% { } }
.seg-ins { background: var(--seg-ins); border-radius: 3px; }
.seg-del { background: var(--seg-del); border-radius: 3px; text-decoration: line-through; }

/* syntax token colours */
.tok-kw { color: var(--tok-kw); } .tok-str { color: var(--tok-str); }
.tok-num { color: var(--tok-num); } .tok-com { color: var(--tok-com); font-style: italic; }
.tok-fn { color: var(--tok-fn); } .tok-type { color: var(--tok-type); }
.tok-lit { color: var(--tok-lit); } .tok-key { color: var(--tok-key); }

/* ---------- annotations ---------- */
body.annotations-off tr.ann-row { display: none; }
tr.ann-row > td { padding: 0 !important; }
.annotation {
  position: relative; margin: .45rem 1rem .55rem 3.4rem; max-width: 46rem;
  background: var(--panel); border: 1px solid var(--border); border-left: 4px solid var(--sev-info);
  border-radius: 6px; padding: .5rem .8rem; font-size: .82rem;
  font-family: -apple-system, "Segoe UI", Roboto, sans-serif; white-space: normal;
  box-shadow: var(--shadow);
}
.annotation::before {
  content: ""; position: absolute; top: -7px; left: 1.6rem;
  border-left: 7px solid transparent; border-right: 7px solid transparent;
  border-bottom: 7px solid var(--border);
}
.annotation::after {
  content: ""; position: absolute; top: -5.5px; left: 1.6rem;
  border-left: 7px solid transparent; border-right: 7px solid transparent;
  border-bottom: 7px solid var(--panel);
}
.ann-title { font-weight: 600; display: flex; align-items: center; gap: .5rem; }
.ann-body { margin-top: .2rem; color: var(--text); }
.ann-body code { background: var(--bg); border: 1px solid var(--border); border-radius: 4px; padding: 0 .25em; font-size: .92em; }
.sev-badge {
  font-size: .66rem; font-weight: 700; text-transform: uppercase; letter-spacing: .05em;
  border-radius: 10px; padding: .05rem .5rem; color: #fff; background: var(--sev-info);
}
.annotation.sev-critical { border-left-color: var(--sev-critical); } .annotation.sev-critical .sev-badge { background: var(--sev-critical); }
.annotation.sev-major { border-left-color: var(--sev-major); } .annotation.sev-major .sev-badge { background: var(--sev-major); }
.annotation.sev-minor { border-left-color: var(--sev-minor); } .annotation.sev-minor .sev-badge { background: var(--sev-minor); }
.annotation.sev-suggestion { border-left-color: var(--sev-suggestion); } .annotation.sev-suggestion .sev-badge { background: var(--sev-suggestion); }

/* ---------- reviewer comments ---------- */
tr.comment-row > td { padding: 0 !important; }
.line-comment {
  margin: .35rem 1rem .5rem 3.4rem; max-width: 46rem; font-size: .82rem;
  font-family: -apple-system, "Segoe UI", Roboto, sans-serif; white-space: normal;
  background: var(--accent-soft); border: 1px solid var(--accent); border-radius: 6px;
  padding: .45rem .7rem;
}
.line-comment .lc-label { font-size: .68rem; font-weight: 700; text-transform: uppercase; color: var(--accent); letter-spacing: .04em; }
.line-comment .lc-text { white-space: pre-wrap; }
.lc-edit { float: right; background: none; border: none; color: var(--accent); font-size: .75rem; text-decoration: underline; padding: 0; }
.comment-editor { margin: .35rem 1rem .5rem 3.4rem; max-width: 46rem; white-space: normal; }
.comment-editor textarea {
  width: 100%; min-height: 4.2em; font: .82rem/1.4 -apple-system, "Segoe UI", Roboto, sans-serif;
  border: 1px solid var(--accent); border-radius: 6px; padding: .45rem .6rem;
  background: var(--panel); color: var(--text); resize: vertical;
}
.ce-actions { display: flex; gap: .5rem; margin: .3rem 0 .2rem; }

/* ---------- overview tab ---------- */
.finding {
  background: var(--panel); border: 1px solid var(--border); border-left: 4px solid var(--sev-info);
  border-radius: 6px; padding: .6rem .9rem; margin: .6rem 0; font-size: .88rem;
}
.finding.sev-critical { border-left-color: var(--sev-critical); }
.finding.sev-major { border-left-color: var(--sev-major); }
.finding.sev-minor { border-left-color: var(--sev-minor); }
.finding.sev-suggestion { border-left-color: var(--sev-suggestion); }
.finding-title { font-weight: 600; display: flex; flex-wrap: wrap; align-items: center; gap: .5rem; }
.finding-loc { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: .78rem; }
.finding-body { margin-top: .25rem; }
.finding-body code, .wt-intro code, .summary-card code {
  background: var(--bg); border: 1px solid var(--border); border-radius: 4px; padding: 0 .25em; font-size: .9em;
  font-family: ui-monospace, Menlo, Consolas, monospace;
}
.recommendation { display: inline-block; font-weight: 700; border-radius: 6px; padding: .3rem .8rem; margin: .4rem 0; }
.recommendation.approve { background: var(--added-bg); color: var(--tick); border: 1px solid var(--tick); }
.recommendation.request-changes { background: var(--removed-bg); color: var(--cross); border: 1px solid var(--cross); }
.recommendation.discussion { background: var(--modified-bg); color: var(--sev-minor); border: 1px solid var(--sev-minor); }

.toast {
  position: fixed; bottom: 1.2rem; left: 50%; transform: translateX(-50%);
  background: var(--text); color: var(--bg); border-radius: 8px; padding: .5rem 1rem;
  font-size: .85rem; opacity: 0; pointer-events: none; transition: opacity .25s; z-index: 60;
}
.toast.show { opacity: .92; }
</style>
</head>
<body>

<header class="page-header">
  <div class="ph-row">
    <h1 id="ph-title">PR Review</h1>
    <span class="ph-meta" id="ph-meta"></span>
    <div class="ph-actions">
      <div class="progress-wrap" title="Blocks marked reviewed (green) or needs-work (red)">
        <div class="progress-bar"><div class="progress-tick" id="pg-tick"></div><div class="progress-cross" id="pg-cross"></div></div>
        <span id="pg-label">0 / 0</span>
      </div>
      <button class="btn" id="ann-toggle" title="Keyboard shortcut: a">Annotations: on</button>
      <button class="btn primary" data-copy-comments>Copy Comments</button>
    </div>
  </div>
  <div class="tabs" role="tablist">
    <button class="tab-btn" role="tab" id="tabbtn-walkthrough" aria-selected="true" data-tab="walkthrough">Walkthrough</button>
    <button class="tab-btn" role="tab" id="tabbtn-overview" aria-selected="false" data-tab="overview">Overview</button>
    <span class="kbd-hint" style="margin-left:auto; align-self:center;">Press <kbd>a</kbd> to toggle annotations</span>
  </div>
</header>

<main>
  <section class="tab-panel" id="tab-walkthrough" role="tabpanel"></section>
  <section class="tab-panel" id="tab-overview" role="tabpanel" hidden></section>
</main>

<footer class="page-footer">
  <button class="btn primary" data-copy-comments>Copy Comments</button>
</footer>

<div class="toast" id="toast"></div>

<script>
/* =========================================================================
 * review-pr-enhanced runtime
 * ========================================================================= */
window.ReviewPage = (() => {
  'use strict';

  /* ---------------------------------------------------------------- utils */
  const $ = (sel, root) => (root || document).querySelector(sel);
  const $$ = (sel, root) => Array.from((root || document).querySelectorAll(sel));
  const el = (tag, cls, text) => {
    const node = document.createElement(tag);
    if (cls) { node.className = cls; }
    if (text !== undefined) { node.textContent = text; }
    return node;
  };
  function toast(message) {
    const t = $('#toast');
    t.textContent = message;
    t.classList.add('show');
    clearTimeout(toast._timer);
    toast._timer = setTimeout(() => t.classList.remove('show'), 1600);
  }

  /* ------------------------------------------------------------ clipboard */
  // navigator.clipboard requires a secure context; browsers disagree about
  // whether file:// qualifies, so feature-detect and fall back to the hidden
  // textarea + execCommand('copy') path, which needs no secure context.
  async function copyText(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      try {
        await navigator.clipboard.writeText(text);
        return true;
      } catch (err) { /* fall through to legacy path */ }
    }
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.setAttribute('readonly', '');
    ta.style.position = 'fixed';
    ta.style.top = '-1000px';
    document.body.appendChild(ta);
    ta.select();
    let ok = false;
    try { ok = document.execCommand('copy'); } catch (err) { ok = false; }
    ta.remove();
    return ok;
  }
  async function copyWithFeedback(text, linkEl, copiedLabel) {
    const ok = await copyText(text);
    if (!ok) { toast('Copy failed — select and copy manually'); return; }
    if (linkEl) {
      const original = linkEl.textContent;
      linkEl.textContent = copiedLabel || 'Copied ✓';
      linkEl.classList.add('copied');
      setTimeout(() => { linkEl.textContent = original; linkEl.classList.remove('copied'); }, 1100);
    }
  }

  /* ---------------------------------------------------------- state store */
  // All review state lives in localStorage, keyed by repo + branch so that
  // several review pages opened from the same file:// origin do not collide.
  const TTL_MS = 14 * 24 * 60 * 60 * 1000; // 2 weeks, renewed on every load
  const STORE_PREFIX = 'rpe::';
  const Store = {
    key: null,
    state: null,
    init(data) {
      this.key = STORE_PREFIX + data.repo + '::' + data.branch;
      this.housekeeping();
      let saved = null;
      try { saved = JSON.parse(localStorage.getItem(this.key)); } catch (err) { saved = null; }
      if (saved && saved.expiresAt && saved.expiresAt < Date.now()) { saved = null; }
      this.state = saved || { v: 1, verdicts: {}, comments: {}, annotationsOn: true };
      this.state.expiresAt = Date.now() + TTL_MS; // renew the TTL
      this.save();
    },
    save() {
      try { localStorage.setItem(this.key, JSON.stringify(this.state)); }
      catch (err) { toast('Warning: could not persist review state'); }
    },
    housekeeping() {
      const dead = [];
      for (let i = 0; i < localStorage.length; i++) {
        const key = localStorage.key(i);
        if (!key || !key.startsWith(STORE_PREFIX)) { continue; }
        try {
          const entry = JSON.parse(localStorage.getItem(key));
          if (entry && entry.expiresAt && entry.expiresAt < Date.now()) { dead.push(key); }
        } catch (err) { dead.push(key); }
      }
      dead.forEach((key) => localStorage.removeItem(key));
    },
    verdict(id) { return this.state.verdicts[id] || null; },
    setVerdict(id, value) {
      if (value) { this.state.verdicts[id] = value; } else { delete this.state.verdicts[id]; }
      this.save();
    },
    comment(blockId, lineIndex) {
      return (this.state.comments[blockId] || {})[lineIndex] || '';
    },
    setComment(blockId, lineIndex, text) {
      if (!this.state.comments[blockId]) { this.state.comments[blockId] = {}; }
      if (text) { this.state.comments[blockId][lineIndex] = text; }
      else {
        delete this.state.comments[blockId][lineIndex];
        if (!Object.keys(this.state.comments[blockId]).length) { delete this.state.comments[blockId]; }
      }
      this.save();
    }
  };

  /* ------------------------------------------------------------ languages */
  // A language definition is plain data; extra definitions can be loaded from
  // a separate file that calls ReviewPage.registerLanguage(name, def).
  //   keywords / literals / types : arrays of words
  //   lineComments : ["//"]        blockComments : [["/*","*/"]]
  //   strings : [{start, end, escape, multiline}]
  //   propertyKeys : true  -> identifiers/strings followed by ":" become keys
  //   decorators : regex source matched at token start (e.g. "@[A-Za-z_]\\w*")
  const C_STRINGS = [
    { start: '"', end: '"', escape: '\\' },
    { start: "'", end: "'", escape: '\\' }
  ];
  const LANGUAGES = {};
  function registerLanguage(names, def) {
    const normalized = {
      keywords: new Set(def.keywords || []),
      literals: new Set(def.literals || []),
      types: new Set(def.types || []),
      lineComments: def.lineComments || [],
      blockComments: def.blockComments || [],
      strings: def.strings || [],
      propertyKeys: !!def.propertyKeys,
      decorators: def.decorators ? new RegExp(def.decorators, 'y') : null
    };
    (Array.isArray(names) ? names : [names]).forEach((name) => { LANGUAGES[name] = normalized; });
  }

  /* ------------------------------------------------------------ tokenizer */
  const IDENT_RE = /[A-Za-z_$][A-Za-z0-9_$]*/y;
  const NUM_RE = /0[xX][0-9a-fA-F_]+n?|0[bB][01_]+n?|0[oO][0-7_]+n?|\d[\d_]*(\.[\d_]+)?([eE][+-]?\d+)?[a-zA-Z]*/y;
  const WS_RE = /[ \t]+/y;

  // findStringEnd: index just past the closing delimiter, or -1.
  function findStringEnd(text, from, spec) {
    let i = from;
    while (i < text.length) {
      if (spec.escape && text[i] === spec.escape && spec.escape !== spec.end) { i += 2; continue; }
      if (spec.escape && spec.escape === spec.end && text.startsWith(spec.end + spec.end, i)) { i += 2; continue; }
      if (text.startsWith(spec.end, i)) { return i + spec.end.length; }
      i++;
    }
    return -1;
  }

  // Tokenizes one line. `state` carries multiline comment/string context
  // between lines: null | {mode:'comment', end} | {mode:'string', spec}.
  function scanLine(text, state, def) {
    const tokens = [];
    const push = (chunk, cls) => {
      if (!chunk) { return; }
      const last = tokens[tokens.length - 1];
      if (last && last.cls === cls) { last.text += chunk; }
      else { tokens.push({ text: chunk, cls }); }
    };
    let pos = 0;
    while (pos < text.length) {
      if (state && state.mode === 'comment') {
        const end = text.indexOf(state.end, pos);
        if (end === -1) { push(text.slice(pos), 'tok-com'); return { tokens, state }; }
        push(text.slice(pos, end + state.end.length), 'tok-com');
        pos = end + state.end.length;
        state = null;
        continue;
      }
      if (state && state.mode === 'string') {
        const end = findStringEnd(text, pos, state.spec);
        if (end === -1) { push(text.slice(pos), 'tok-str'); return { tokens, state }; }
        push(text.slice(pos, end), 'tok-str');
        pos = end;
        state = null;
        continue;
      }

      const rest = text.slice(pos);
      const ch = text[pos];

      const lc = def.lineComments.find((c) => rest.startsWith(c));
      if (lc) { push(rest, 'tok-com'); return { tokens, state: null }; }

      const bc = def.blockComments.find((c) => rest.startsWith(c[0]));
      if (bc) {
        const end = text.indexOf(bc[1], pos + bc[0].length);
        if (end === -1) {
          push(rest, 'tok-com');
          return { tokens, state: { mode: 'comment', end: bc[1] } };
        }
        push(text.slice(pos, end + bc[1].length), 'tok-com');
        pos = end + bc[1].length;
        continue;
      }

      const str = def.strings.find((s) => rest.startsWith(s.start));
      if (str) {
        const end = findStringEnd(text, pos + str.start.length, str);
        if (end === -1) {
          push(rest, 'tok-str');
          return { tokens, state: str.multiline ? { mode: 'string', spec: str } : null };
        }
        const chunk = text.slice(pos, end);
        pos = end;
        // In key/value languages, a string directly followed by ":" is a key.
        if (def.propertyKeys && /^\s*:/.test(text.slice(pos))) { push(chunk, 'tok-key'); }
        else { push(chunk, 'tok-str'); }
        continue;
      }

      if (def.decorators) {
        def.decorators.lastIndex = pos;
        const m = def.decorators.exec(text);
        if (m && m.index === pos) { push(m[0], 'tok-fn'); pos += m[0].length; continue; }
      }

      if (/[0-9]/.test(ch) || (ch === '.' && /[0-9]/.test(text[pos + 1] || ''))) {
        NUM_RE.lastIndex = pos;
        const m = NUM_RE.exec(text);
        if (m && m.index === pos) { push(m[0], 'tok-num'); pos += m[0].length; continue; }
      }

      IDENT_RE.lastIndex = pos;
      const idm = IDENT_RE.exec(text);
      if (idm && idm.index === pos) {
        const word = idm[0];
        const after = text.slice(pos + word.length);
        let cls = null;
        if (def.keywords.has(word)) { cls = 'tok-kw'; }
        else if (def.literals.has(word)) { cls = 'tok-lit'; }
        else if (def.types.has(word)) { cls = 'tok-type'; }
        else if (def.propertyKeys && /^\s*:/.test(after)) { cls = 'tok-key'; }
        else if (/^\s*\(/.test(after)) { cls = 'tok-fn'; }
        push(word, cls);
        pos += word.length;
        continue;
      }

      WS_RE.lastIndex = pos;
      const wm = WS_RE.exec(text);
      if (wm && wm.index === pos) { push(wm[0], null); pos += wm[0].length; continue; }

      push(ch, null);
      pos += 1;
    }
    return { tokens, state };
  }

  function renderTokens(container, tokens) {
    tokens.forEach((token) => {
      if (token.cls) { container.appendChild(el('span', token.cls, token.text)); }
      else { container.appendChild(document.createTextNode(token.text)); }
    });
  }

  /* ----------------------------------------------------------- rendering */
  let DATA = null;
  const blockIndex = {}; // blockId -> {block, sectionEl}

  function verdictGroup(id, label) {
    const group = el('span', 'verdict-group');
    group.dataset.verdictId = id;
    const tick = el('button', 'v-btn tick', '✓');
    tick.title = 'Reviewed — acceptable' + (label ? ' (' + label + ')' : '');
    const cross = el('button', 'v-btn cross', '✗');
    cross.title = 'Needs work' + (label ? ' (' + label + ')' : '');
    tick.addEventListener('click', () => {
      Store.setVerdict(id, Store.verdict(id) === 'tick' ? null : 'tick');
      refreshVerdicts();
    });
    cross.addEventListener('click', () => {
      Store.setVerdict(id, Store.verdict(id) === 'cross' ? null : 'cross');
      refreshVerdicts();
    });
    group.append(tick, cross);
    return group;
  }

  function refreshVerdicts() {
    $$('.verdict-group').forEach((group) => {
      const value = Store.verdict(group.dataset.verdictId);
      group.querySelector('.tick').classList.toggle('on', value === 'tick');
      group.querySelector('.cross').classList.toggle('on', value === 'cross');
    });
    // header progress: block verdicts only
    const ids = Object.keys(blockIndex);
    const ticked = ids.filter((id) => Store.verdict(id) === 'tick').length;
    const crossed = ids.filter((id) => Store.verdict(id) === 'cross').length;
    $('#pg-tick').style.width = ids.length ? (100 * ticked / ids.length) + '%' : '0';
    $('#pg-cross').style.width = ids.length ? (100 * crossed / ids.length) + '%' : '0';
    $('#pg-label').textContent = (ticked + crossed) + ' / ' + ids.length;
    // per-section progress chips
    $$('.wt-section').forEach((section) => {
      const chip = section.querySelector('.sec-progress');
      if (!chip) { return; }
      const blockIds = $$('.code-block', section).map((b) => b.dataset.blockId);
      const done = blockIds.filter((id) => Store.verdict(id)).length;
      chip.textContent = done + ' / ' + blockIds.length + ' blocks reviewed';
    });
  }

  function baseName(path) { return path.split('/').pop(); }

  function renderSummaryCard() {
    const card = el('div', 'summary-card');
    const heading = el('h3', null, 'PR summary');
    heading.style.marginTop = '0';
    card.appendChild(heading);
    const body = el('div');
    body.innerHTML = DATA.summaryHtml;
    card.appendChild(body);
    return card;
  }

  function renderFilesCard() {
    const card = el('div', 'files-card');
    const heading = el('h3', null, 'Files changed (' + DATA.filesChanged.length + ')');
    heading.style.marginTop = '0';
    card.appendChild(heading);
    DATA.filesChanged.forEach((file) => {
      const row = el('div', 'file-row');
      row.appendChild(el('span', 'file-status ' + (file.status || 'modified'), file.status || 'modified'));
      const firstBlock = Object.values(blockIndex).find((entry) => entry.block.file === file.path);
      if (firstBlock) {
        const link = el('a', 'file-path', file.path);
        link.href = '#' + firstBlock.block.id;
        link.addEventListener('click', (event) => {
          event.preventDefault();
          switchTab('walkthrough');
          document.getElementById(firstBlock.block.id).scrollIntoView({ behavior: 'smooth', block: 'start' });
        });
        row.appendChild(link);
      } else {
        row.appendChild(el('span', 'file-path', file.path));
      }
      row.appendChild(el('span', 'file-desc', file.description || ''));
      const verdict = el('span', 'file-verdict');
      verdict.appendChild(verdictGroup('file:' + file.path, file.path));
      row.appendChild(verdict);
      card.appendChild(row);
    });
    return card;
  }

  function renderFlow(flow) {
    const wrap = el('div', 'flow');
    flow.forEach((node, index) => {
      if (index > 0) {
        const arrow = el('span', 'flow-arrow');
        if (node.edge) { arrow.appendChild(el('span', 'fa-label', node.edge)); }
        arrow.appendChild(el('span', null, '→'));
        wrap.appendChild(arrow);
      }
      const box = el('span', 'flow-node ' + (node.kind || 'step'));
      box.appendChild(el('span', null, node.label));
      if (node.note) { box.appendChild(el('span', 'fn-note', node.note)); }
      wrap.appendChild(box);
    });
    return wrap;
  }

  function renderAnnotation(annotation) {
    const severity = annotation.severity || 'info';
    const card = el('div', 'annotation sev-' + severity);
    const title = el('div', 'ann-title');
    title.appendChild(el('span', 'sev-badge', severity));
    title.appendChild(el('span', null, annotation.title || ''));
    card.appendChild(title);
    if (annotation.bodyHtml) {
      const body = el('div', 'ann-body');
      body.innerHTML = annotation.bodyHtml;
      card.appendChild(body);
    }
    return card;
  }

  function commentRow(block, lineIndex) {
    const tr = el('tr', 'comment-row');
    tr.dataset.commentFor = block.id + ':' + lineIndex;
    const td = el('td');
    td.colSpan = 3;
    tr.appendChild(td);
    renderCommentCell(td, block, lineIndex, false);
    return tr;
  }

  function renderCommentCell(td, block, lineIndex, editing) {
    td.textContent = '';
    const saved = Store.comment(block.id, lineIndex);
    if (editing) {
      const editor = el('div', 'comment-editor');
      const textarea = el('textarea');
      textarea.value = saved;
      textarea.placeholder = 'Comment on ' + baseName(block.file) + ' line ' + displayLineNumber(block, lineIndex);
      const actions = el('div', 'ce-actions');
      const save = el('button', 'btn primary', 'Save');
      const cancel = el('button', 'btn', 'Cancel');
      const remove = el('button', 'btn', 'Delete');
      save.addEventListener('click', () => {
        Store.setComment(block.id, lineIndex, textarea.value.trim());
        renderCommentCell(td, block, lineIndex, false);
        syncCommentRowVisibility(td.parentElement, block, lineIndex);
      });
      cancel.addEventListener('click', () => {
        renderCommentCell(td, block, lineIndex, false);
        syncCommentRowVisibility(td.parentElement, block, lineIndex);
      });
      remove.addEventListener('click', () => {
        Store.setComment(block.id, lineIndex, '');
        renderCommentCell(td, block, lineIndex, false);
        syncCommentRowVisibility(td.parentElement, block, lineIndex);
      });
      actions.append(save, cancel);
      if (saved) { actions.appendChild(remove); }
      editor.append(textarea, actions);
      td.appendChild(editor);
      setTimeout(() => textarea.focus(), 0);
    } else if (saved) {
      const card = el('div', 'line-comment');
      const edit = el('button', 'lc-edit', 'Edit');
      edit.addEventListener('click', () => renderCommentCell(td, block, lineIndex, true));
      card.appendChild(edit);
      card.appendChild(el('div', 'lc-label', 'Your comment — line ' + displayLineNumber(block, lineIndex)));
      card.appendChild(el('div', 'lc-text', saved));
      td.appendChild(card);
    }
  }

  function syncCommentRowVisibility(tr, block, lineIndex) {
    if (!tr) { return; }
    const hasContent = !!Store.comment(block.id, lineIndex) || tr.querySelector('textarea');
    tr.style.display = hasContent ? '' : 'none';
  }

  function displayLineNumber(block, lineIndex) {
    const line = block.lines[lineIndex];
    return line && line.n != null ? line.n : '?';
  }

  function renderCodeBlock(block) {
    const def = LANGUAGES[block.language] || LANGUAGES.text;
    const section = el('section', 'code-block');
    section.id = block.id;
    section.dataset.blockId = block.id;

    const header = el('header', 'cb-header');
    const file = el('span', 'cb-file', block.file);
    file.title = block.file;
    header.appendChild(file);
    header.appendChild(el('span', 'cb-lang', block.language || 'text'));
    if (block.lines.length) {
      const first = block.lines.find((line) => line.n != null);
      const last = [...block.lines].reverse().find((line) => line.n != null);
      if (first && last) { header.appendChild(el('span', 'ph-meta', 'lines ' + first.n + '–' + last.n)); }
    }
    const actions = el('div', 'cb-actions');
    const copyName = el('button', 'copy-link', 'Copy filename');
    copyName.addEventListener('click', () => copyWithFeedback(baseName(block.file), copyName));
    const copyPath = el('button', 'copy-link', 'Copy path');
    copyPath.addEventListener('click', () => copyWithFeedback(block.file, copyPath));
    actions.append(copyName, copyPath, verdictGroup(block.id, baseName(block.file)));
    header.appendChild(actions);
    section.appendChild(header);

    if (block.note) {
      const note = el('div', 'cb-note');
      note.innerHTML = block.note;
      section.appendChild(note);
    }

    const scroll = el('div', 'cb-scroll');
    const table = el('table', 'cb-table');
    const tbody = el('tbody');
    table.appendChild(tbody);
    scroll.appendChild(table);
    section.appendChild(scroll);

    const annotationsByLine = {};
    (block.annotations || []).forEach((annotation) => {
      let index = annotation.lineIndex;
      if (index === undefined && annotation.line !== undefined) {
        index = block.lines.findIndex((line) => line.n === annotation.line && line.type !== 'removed');
        if (index === -1) { index = block.lines.findIndex((line) => line.n === annotation.line); }
      }
      if (index === undefined || index < 0) { index = 0; }
      (annotationsByLine[index] = annotationsByLine[index] || []).push(annotation);
    });

    let scanState = null;
    block.lines.forEach((line, lineIndex) => {
      const type = line.type || 'context';
      const tr = el('tr', 'code-row ln-' + type);
      tr.dataset.line = line.n != null ? line.n : '';
      const num = el('td', 'ln-num', line.n != null ? String(line.n) : '·');
      const act = el('td', 'ln-act');
      const addBtn = el('button', 'ln-add-comment', '+');
      addBtn.title = 'Add a comment on this line';
      act.appendChild(addBtn);
      const code = el('td', 'ln-code');

      if (line.segments && line.segments.length) {
        line.segments.forEach((segment) => {
          const result = scanLine(segment.text, scanState, def);
          scanState = result.state;
          if (segment.type === 'ins' || segment.type === 'del') {
            const mark = el('span', segment.type === 'ins' ? 'seg-ins' : 'seg-del');
            renderTokens(mark, result.tokens);
            code.appendChild(mark);
          } else {
            renderTokens(code, result.tokens);
          }
        });
      } else {
        const result = scanLine(line.text || '', scanState, def);
        scanState = result.state;
        renderTokens(code, result.tokens);
      }
      if (!code.childNodes.length) { code.appendChild(document.createTextNode(' ')); }

      tr.append(num, act, code);
      tbody.appendChild(tr);

      // reviewer comment row (hidden when empty)
      const cRow = commentRow(block, lineIndex);
      tbody.appendChild(cRow);
      syncCommentRowVisibility(cRow, block, lineIndex);
      addBtn.addEventListener('click', () => {
        renderCommentCell(cRow.querySelector('td'), block, lineIndex, true);
        cRow.style.display = '';
      });

      // annotation rows
      (annotationsByLine[lineIndex] || []).forEach((annotation) => {
        const aRow = el('tr', 'ann-row');
        const td = el('td');
        td.colSpan = 3;
        td.appendChild(renderAnnotation(annotation));
        aRow.appendChild(td);
        tbody.appendChild(aRow);
      });
    });

    blockIndex[block.id] = { block, el: section };
    return section;
  }

  function renderWalkthrough(container) {
    container.appendChild(renderSummaryCard());
    container.appendChild(renderFilesCard());
    (DATA.walkthrough || []).forEach((wtSection, index) => {
      const section = el('section', 'wt-section');
      section.id = wtSection.id || ('wt-' + index);
      const heading = el('h2');
      heading.appendChild(el('span', null, (index + 1) + '. ' + wtSection.title));
      if ((wtSection.blocks || []).length) { heading.appendChild(el('span', 'sec-progress', '')); }
      section.appendChild(heading);
      if (wtSection.introHtml) {
        const intro = el('div', 'wt-intro');
        intro.innerHTML = wtSection.introHtml;
        section.appendChild(intro);
      }
      if (wtSection.flow && wtSection.flow.length) { section.appendChild(renderFlow(wtSection.flow)); }
      (wtSection.blocks || []).forEach((block) => section.appendChild(renderCodeBlock(block)));
      container.appendChild(section);
    });
  }

  function renderOverview(container) {
    container.appendChild(renderSummaryCard());
    container.appendChild(renderFilesCard());
    const overview = DATA.overview || {};

    const findingsHeading = el('h2', null, 'Review findings');
    container.appendChild(findingsHeading);
    const bySeverity = { critical: [], major: [], minor: [], suggestion: [] };
    (overview.findings || []).forEach((finding) => {
      (bySeverity[finding.severity] = bySeverity[finding.severity] || []).push(finding);
    });
    const SEVERITY_LABELS = { critical: 'Critical', major: 'Major', minor: 'Minor', suggestion: 'Suggestions' };
    Object.keys(bySeverity).forEach((severity) => {
      const findings = bySeverity[severity];
      if (!findings || !findings.length) { return; }
      container.appendChild(el('h3', null, SEVERITY_LABELS[severity] || severity));
      findings.forEach((finding) => {
        const card = el('div', 'finding sev-' + severity);
        const title = el('div', 'finding-title');
        title.appendChild(el('span', 'sev-badge', severity));
        title.appendChild(el('span', null, finding.title));
        if (finding.file) {
          const loc = finding.file + (finding.line ? ':' + finding.line : '');
          if (finding.blockId && blockIndex[finding.blockId]) {
            const link = el('a', 'finding-loc', loc);
            link.href = '#' + finding.blockId;
            link.addEventListener('click', (event) => {
              event.preventDefault();
              switchTab('walkthrough');
              const target = document.getElementById(finding.blockId);
              target.scrollIntoView({ behavior: 'smooth', block: 'center' });
              if (finding.line) {
                const row = target.querySelector('tr[data-line="' + finding.line + '"]');
                if (row) {
                  row.classList.remove('flash');
                  void row.offsetWidth;
                  row.classList.add('flash');
                }
              }
            });
            title.appendChild(link);
          } else {
            title.appendChild(el('span', 'finding-loc', loc));
          }
        }
        card.appendChild(title);
        if (finding.bodyHtml) {
          const body = el('div', 'finding-body');
          body.innerHTML = finding.bodyHtml;
          card.appendChild(body);
        }
        container.appendChild(card);
      });
    });
    if (!(overview.findings || []).length) {
      container.appendChild(el('p', null, 'No findings.'));
    }

    if (overview.testAssessmentHtml) {
      container.appendChild(el('h2', null, 'Test assessment'));
      const tests = el('div', 'summary-card');
      tests.innerHTML = overview.testAssessmentHtml;
      container.appendChild(tests);
    }

    if (overview.recommendation) {
      container.appendChild(el('h2', null, 'Overall recommendation'));
      const LABELS = { approve: 'Approve', 'request-changes': 'Request changes', discussion: 'Needs discussion' };
      container.appendChild(el('div', 'recommendation ' + overview.recommendation, LABELS[overview.recommendation] || overview.recommendation));
      if (overview.recommendationNote) {
        const note = el('p');
        note.innerHTML = overview.recommendationNote;
        container.appendChild(note);
      }
    }
  }

  /* ------------------------------------------------------- interactions */
  function switchTab(name) {
    $$('.tab-btn').forEach((btn) => btn.setAttribute('aria-selected', String(btn.dataset.tab === name)));
    $('#tab-walkthrough').hidden = name !== 'walkthrough';
    $('#tab-overview').hidden = name !== 'overview';
  }

  function setAnnotationsVisible(visible) {
    document.body.classList.toggle('annotations-off', !visible);
    $('#ann-toggle').textContent = 'Annotations: ' + (visible ? 'on' : 'off');
    Store.state.annotationsOn = visible;
    Store.save();
  }

  function buildCommentsExport() {
    const lines = [];
    lines.push('Review comments — ' + DATA.repo + ' @ ' + DATA.branch + ' (base: ' + DATA.baseBranch + ')');
    const byFile = new Map();
    (DATA.walkthrough || []).forEach((wtSection) => {
      (wtSection.blocks || []).forEach((block) => {
        const comments = Store.state.comments[block.id];
        if (!comments) { return; }
        Object.keys(comments)
          .map(Number)
          .sort((a, b) => a - b)
          .forEach((lineIndex) => {
            if (!byFile.has(block.file)) { byFile.set(block.file, []); }
            byFile.get(block.file).push({ line: displayLineNumber(block, lineIndex), text: comments[lineIndex] });
          });
      });
    });
    if (!byFile.size) { return null; }
    byFile.forEach((entries, file) => {
      lines.push('');
      lines.push(file);
      entries.forEach((entry) => {
        const text = entry.text.replace(/\n/g, '\n    ');
        lines.push('  L' + entry.line + ': ' + text);
      });
    });
    return lines.join('\n');
  }

  /* ------------------------------------------------------------- init */
  function init() {
    const dataEl = document.getElementById('review-data');
    DATA = JSON.parse(dataEl.textContent);
    Store.init(DATA);

    // Findings anchored to a block appear as annotations on that block, so the
    // review data never has to state an issue twice.
    const allBlocks = (DATA.walkthrough || []).flatMap((wtSection) => wtSection.blocks || []);
    ((DATA.overview || {}).findings || []).forEach((finding) => {
      if (!finding.blockId) { return; }
      const block = allBlocks.find((candidate) => candidate.id === finding.blockId);
      if (!block) { return; }
      (block.annotations = block.annotations || []).push({
        line: finding.line,
        lineIndex: finding.lineIndex,
        severity: finding.severity,
        title: finding.title,
        bodyHtml: finding.bodyHtml
      });
    });

    $('#ph-title').textContent = DATA.title || 'PR Review';
    const meta = $('#ph-meta');
    meta.innerHTML = '';
    meta.appendChild(el('code', null, DATA.repo));
    meta.appendChild(document.createTextNode(' '));
    meta.appendChild(el('code', null, DATA.branch));
    meta.appendChild(document.createTextNode(' vs '));
    meta.appendChild(el('code', null, DATA.baseBranch));
    if (DATA.generatedAt) { meta.appendChild(document.createTextNode(' · generated ' + DATA.generatedAt)); }
    document.title = (DATA.title ? DATA.title + ' — ' : '') + DATA.branch;

    renderWalkthrough($('#tab-walkthrough'));
    renderOverview($('#tab-overview'));
    refreshVerdicts();
    setAnnotationsVisible(Store.state.annotationsOn !== false);

    $$('.tab-btn').forEach((btn) => btn.addEventListener('click', () => switchTab(btn.dataset.tab)));
    $('#ann-toggle').addEventListener('click', () => setAnnotationsVisible(document.body.classList.contains('annotations-off')));
    $$('[data-copy-comments]').forEach((btn) => btn.addEventListener('click', async () => {
      const text = buildCommentsExport();
      if (!text) { toast('No comments to copy yet'); return; }
      await copyWithFeedback(text, btn, 'Copied ✓');
      toast('Comments copied to clipboard');
    }));
    document.addEventListener('keydown', (event) => {
      const target = event.target;
      if (target && (target.tagName === 'TEXTAREA' || target.tagName === 'INPUT' || target.isContentEditable)) { return; }
      if (event.key === 'a' && !event.metaKey && !event.ctrlKey && !event.altKey) {
        setAnnotationsVisible(document.body.classList.contains('annotations-off'));
      }
    });
  }

  document.addEventListener('DOMContentLoaded', init);
  return { registerLanguage, copyText, get data() { return DATA; } };
})();
</script>

              "text": "/**"

            {

              "text": "/**"

              "type": "added",

          "language": "javascript",
          "note": "<code>any<\/code>: attempt everything; partial failure is logged (not retried), total failure re-queues.",
          "lines": [
            {
              "n": 71,
              "type": "added",
              "text": "/**"
            },
            {
              "n": 72,
              "type": "added",
              "text": " * Sends every payload, requiring only one to succeed."
            },
            {
              "n": 73,
              "type": "added",
              "text": " *"
            },
            {
              "n": 74,
              "type": "added",
              "text": " * Every payload is attempted regardless of earlier failures, since each one"
            },
            {
              "n": 75,
              "type": "added",
              "text": " * that lands is one that will not be retried by anything else. Failures are"
            },
            {
              "n": 76,
              "type": "added",
              "text": " * logged as errors rather than warnings: the message is deleted from the queue"
            },
            {
              "n": 77,
              "type": "added",
              "text": " * once any payload succeeds, so these log lines are the only record that those"
            },
            {
              "n": 78,
              "type": "added",
              "text": " * submissions never reached the destination."
            },
            {
              "n": 79,
              "type": "added",
              "text": " * @param {Array<Record<string, unknown>>} payloads"
            },
            {
              "n": 80,
              "type": "added",
              "text": " * @param {DestinationSender} send"
            },
            {
              "n": 81,
              "type": "added",
              "text": " * @param {string} referenceNumber"
            },
            {
              "n": 82,
              "type": "added",
              "text": " * @returns {Promise<void>}"
            },
            {
              "n": 83,
              "type": "added",
              "text": " */"
            },
            {
              "n": 84,
              "type": "added",
              "text": "async function sendRequiringAny(payloads, send, referenceNumber) {"
            },
            {
              "n": 85,
              "type": "added",
              "text": "  const results = await Promise.allSettled("
            },
            {
              "n": 86,
              "type": "added",
              "text": "    payloads.map((payload) => send(payload))"
            },
            {
              "n": 87,
              "type": "added",
              "text": "  )"
            },
            {
              "n": 88,
              "type": "added",
              "text": ""
            },
            {
              "n": 89,
              "type": "added",
              "text": "  /** @type {PromiseRejectedResult[]} */"
            },
            {
              "n": 90,
              "type": "added",
              "text": "  const failed = results.filter((result) => result.status === 'rejected')"
            },
            {
              "n": 91,
              "type": "added",
              "text": ""
            },
            {
              "n": 92,
              "type": "added",
              "text": "  if (!failed.length) {"
            },
            {
              "n": 93,
              "type": "added",
              "text": "    return"
            },
            {
              "n": 94,
              "type": "added",
              "text": "  }"
            },
            {
              "n": 95,
              "type": "added",
              "text": ""
            },
            {
              "n": 96,
              "type": "added",
              "text": "  if (failed.length === payloads.length) {"
            },
            {
              "n": 97,
              "type": "added",
              "text": "    throw new Error("
            },
            {
              "n": 98,
              "type": "added",
              "text": "      `All ${payloads.length} submissions failed for ${referenceNumber}: ${failed"
            },
            {
              "n": 99,
              "type": "added",
              "text": "        .map((result) => getErrorMessage(result.reason))"
            },
            {
              "n": 100,
              "type": "added",
              "text": "        .join(', ')}`"
            },
            {
              "n": 101,
              "type": "added",
              "text": "    )"
            },
            {
              "n": 102,
              "type": "added",
              "text": "  }"
            },
            {
              "n": 103,
              "type": "added",
              "text": ""
            },
            {
              "n": 104,
              "type": "added",
              "text": "  const lost = results"
            },
            {
              "n": 105,
              "type": "added",
              "text": "    .map((result, index) => ({ result, payload: payloads[index] }))"
            },
            {
              "n": 106,
              "type": "added",
              "text": "    .filter(({ result }) => result.status === 'rejected')"
            },
            {
              "n": 107,
              "type": "added",
              "text": "    .map(({ payload }) => JSON.stringify(payload))"
            },
            {
              "n": 108,
              "type": "added",
              "text": "    .join(', ')"
            },
            {
              "n": 109,
              "type": "added",
              "text": ""
            },
            {
              "n": 110,
              "type": "added",
              "text": "  logger.error("
            },
            {
              "n": 111,
              "type": "added",
              "text": "    `${failed.length} of ${payloads.length} submissions failed for ${referenceNumber} and will not be retried. ` +"
            },
            {
              "n": 112,
              "type": "added",
              "text": "      `Lost payloads: ${lost}`"
            },
            {
              "n": 113,
              "type": "added",
              "text": "  )"
            },
            {
              "n": 114,
              "type": "added",
              "text": "}"
            }
          ]

        {
          "id": "blk-types-expansion",
          "file": "src/service/rule-mapping/types.js",
          "language": "javascript",
          "note": "The Expansion type and the two delivery success modes — the trade-off between duplication and loss is documented where the choice is made.",
          "lines": [
            {
              "n": 171,
              "type": "added",
              "text": "/**"
            },
            {
              "n": 172,
              "type": "added",
              "text": " * How many of an expanded submission's payloads must reach the destination for"
            },
            {
              "n": 173,
              "type": "added",
              "text": " * the source message to count as handled (and so be deleted from the queue)."
            },
            {
              "n": 174,
              "type": "added",
              "text": " *"
            },
            {
              "n": 175,
              "type": "added",
              "text": " * \"all\": every payload must succeed. A failure leaves the message on the queue,"
            },
            {
              "n": 176,
              "type": "added",
              "text": " * so redelivery re-sends the whole set - payloads that already landed are"
            },
            {
              "n": 177,
              "type": "added",
              "text": " * duplicated in the destination system."
            },
            {
              "n": 178,
              "type": "added",
              "text": " *"
            },
            {
              "n": 179,
              "type": "added",
              "text": " * \"any\": one payload succeeding is enough. Nothing is duplicated, but the"
            },
            {
              "n": 180,
              "type": "added",
              "text": " * payloads that failed are lost - the message is deleted and nothing retries"
            },
            {
              "n": 181,
              "type": "added",
              "text": " * them."
            },
            {
              "n": 182,
              "type": "added",
              "text": " * @typedef {'all' | 'any'} DeliverySuccessMode"
            },
            {
              "n": 183,
              "type": "added",
              "text": " */"
            },
            {
              "n": 184,
              "type": "added",
              "text": ""
            },
            {
              "n": 185,
              "type": "added",
              "text": "/**"
            },
            {
              "n": 186,
              "type": "added",
              "text": " * The delivery success modes, keyed by name."
            },
            {
              "n": 187,
              "type": "added",
              "text": " * @type {Readonly<Record<'ALL' | 'ANY', DeliverySuccessMode>>}"
            },
            {
              "n": 188,
              "type": "added",
              "text": " */"
            },
            {
              "n": 189,
              "type": "added",
              "text": "export const DELIVERY_SUCCESS_MODE = Object.freeze({"
            },
            {
              "n": 190,
              "type": "added",
              "text": "  ALL: 'all',"
            },
            {
              "n": 191,
              "type": "added",
              "text": "  ANY: 'any'"
            },
            {
              "n": 192,
              "type": "added",
              "text": "})"
            },
            {
              "n": 193,
              "type": "added",
              "text": ""
            },
            {
              "n": 194,
              "type": "added",
              "text": "/**"
            },
            {
              "n": 195,
              "type": "added",
              "text": " * The mode applied to an expansion that does not name one."
            },
            {
              "n": 196,
              "type": "added",
              "text": " * @type {DeliverySuccessMode}"
            },
            {
              "n": 197,
              "type": "added",
              "text": " */"
            },
            {
              "n": 198,
              "type": "added",
              "text": "export const DEFAULT_DELIVERY_SUCCESS_MODE = DELIVERY_SUCCESS_MODE.ALL"
            },
            {
              "n": 199,
              "type": "added",
              "text": ""
            },
            {
              "n": 200,
              "type": "added",
              "text": "/**"
            },
            {
              "n": 201,
              "type": "added",
              "text": " * Fans a single mapped payload out into one submission per repeater entry."
            },
            {
              "n": 202,
              "type": "added",
              "text": " *"
            },
            {
              "n": 203,
              "type": "added",
              "text": " * The base payload is produced by the rules as normal; each repeater entry then"
            },
            {
              "n": 204,
              "type": "added",
              "text": " * contributes an overlay of `targets` that is merged over it. The target value"
            },
            {
              "n": 205,
              "type": "added",
              "text": " * expressions are evaluated once per entry, with that entry in scope as the"
            },
            {
              "n": 206,
              "type": "added",
              "text": " * current item, so \"answer\" expressions read the entry's answers first."
            },
            {
              "n": 207,
              "type": "added",
              "text": " *"
            },
            {
              "n": 208,
              "type": "added",
              "text": " * When the repeater has no entries the base payload is sent unchanged, which is"
            },
            {
              "n": 209,
              "type": "added",
              "text": " * what the targets' ordinary fallback rules exist for."
            },
            {
              "n": 210,
              "type": "added",
              "text": " * @typedef {object} Expansion"
            },
            {
              "n": 211,
              "type": "added",
              "text": " * @property {string} id - Identifier for the expansion, used in error messages"
            },
            {
              "n": 212,
              "type": "added",
              "text": " * @property {string} [description] - Human-readable description"
            },
            {
              "n": 213,
              "type": "added",
              "text": " * @property {RepeaterRef} repeater - The repeater to expand over"
            },
            {
              "n": 214,
              "type": "added",
              "text": " * @property {string} [filterAnswered] - Question id that must be answered for an"
            },
            {
              "n": 215,
              "type": "added",
              "text": " *   entry to produce a payload; blank entries are skipped"
            },
            {
              "n": 216,
              "type": "added",
              "text": " * @property {DeliverySuccessMode} [deliverySuccessMode] - Defaults to \"all\""
            },
            {
              "n": 217,
              "type": "added",
              "text": " * @property {Record<string, ValueExpression>} targets - Output targets to overlay"
            },
            {
              "n": 218,
              "type": "added",
              "text": " *   on the base payload, evaluated once per entry"
            },
            {
              "n": 219,
              "type": "context",
              "text": " */"
            }
          ]
        },
        {
          "id": "blk-schema-expansion",

          "lines": [

              "type": "added",
              "text": "/**"

              "n": 122,
              "type": "added",

        {
          "id": "blk-engine-context",
          "file": "src/service/rule-mapping/engine.js",
          "language": "javascript",
          "note": "Refactor: context construction is extracted so <code>resolveExpansion<\/code> can reuse it. The rules loop itself is unchanged.",
          "lines": [
            {
              "n": 19,
              "type": "context",
              "text": "/**"
            },
            {
              "n": 20,
              "type": "added",
              "text": " * Builds the context threaded through condition evaluation and value"
            },
            {
              "n": 21,
              "type": "added",
              "text": " * resolution."
            },
            {
              "n": 22,
              "type": "context",
              "text": " * @param {MappingDefinition} mapping - The mapping definition"
            },
            {
              "n": 23,
              "type": "context",
              "text": " * @param {FormAdapterSubmissionMessage} message - The form submission message"
            },
            {
              "n": 24,
              "type": "added",
              "text": " * @returns {MappingContext}"
            },
            {
              "n": 25,
              "type": "context",
              "text": " */"
            },
            {
              "n": 26,
              "type": "added",
              "text": "function buildContext(mapping, message) {"
            },
            {
              "n": 27,
              "type": "context",
              "text": "  if (!message.messageId) {"
            },
            {
              "n": 28,
              "type": "context",
              "text": "    throw new Error('Unexpected missing message.messageId')"
            },
            {
              "n": 29,
              "type": "context",
              "text": "  }"
            },
            {
              "n": 30,
              "type": "context",
              "text": ""
            },
            {
              "n": 31,
              "type": "added",
              "text": "  return {"
            },
            {
              "n": 32,
              "type": "context",
              "text": "    message,"
            },
            {
              "n": 33,
              "type": "context",
              "text": "    main: /** @type {Record<string, unknown>} */ (message.data.main ?? {}),"
            },
            {
              "n": 34,
              "type": "context",
              "text": "    repeaters: /** @type {Record<string, Array<Record<string, unknown>>>} */ ("
            },
            {
              "n": 35,
              "type": "context",
              "text": "      message.data.repeaters ?? {}"
            },
            {
              "n": 36,
              "type": "context",
              "text": "    ),"
            },
            {
              "n": 37,
              "type": "context",
              "text": "    mapping,"
            },
            {
              "n": 38,
              "type": "context",
              "text": "    output: {}"
            },
            {
              "n": 39,
              "type": "context",
              "text": "  }"
            },
            {
              "n": 40,
              "type": "added",
              "text": "}"
            },
            {
              "n": 41,
              "type": "added",
              "text": ""
            },
            {
              "n": 42,
              "type": "added",
              "text": "/**"
            },
            {
              "n": 43,
              "type": "added",
              "text": " * Maps a form submission to an output payload using a mapping definition."
            },
            {
              "n": 44,
              "type": "added",
              "text": " *"
            },
            {
              "n": 45,
              "type": "added",
              "text": " * Rules are evaluated in file order. For each output target the first rule"
            },
            {
              "n": 46,
              "type": "added",
              "text": " * whose \"when\" condition passes (or that has no condition) and whose value"
            },
            {
              "n": 47,
              "type": "added",
              "text": " * resolves to a defined value wins; later rules for the same target are"
            },
            {
              "n": 48,
              "type": "added",
              "text": " * skipped. Targets whose rules all fall through are omitted from the payload."
            },
            {
              "n": 49,
              "type": "added",
              "text": " *"
            },
            {
              "n": 50,
              "type": "added",
              "text": " * This is always a single payload. Mappings that fan out into several"
            },
            {
              "n": 51,
              "type": "added",
              "text": " * submissions layer \"resolveExpansion\" on top of this base payload."
            },
            {
              "n": 52,
              "type": "added",
              "text": " * @param {MappingDefinition} mapping - The mapping definition"
            },
            {
              "n": 53,
              "type": "added",
              "text": " * @param {FormAdapterSubmissionMessage} message - The form submission message"
            },
            {
              "n": 54,
              "type": "added",
              "text": " * @returns {Record<string, unknown>} The mapped output payload"
            },
            {
              "n": 55,
              "type": "added",
              "text": " */"
            },
            {
              "n": 56,
              "type": "added",
              "text": "export function mapWithRules(mapping, message) {"
            },
            {
              "n": 57,
              "type": "added",
              "text": "  const context = buildContext(mapping, message)"
            },
            {
              "n": 58,
              "type": "context",
              "text": ""
            },
            {
              "n": 59,
              "type": "context",
              "text": "  for (const rule of mapping.rules) {"
            },
            {
              "n": 60,
              "type": "context",
              "text": "    if (Object.hasOwn(context.output, rule.target)) {"
            },
            {
              "n": 61,
              "type": "context",
              "text": "      continue"
            },
            {
              "n": 62,
              "type": "context",
              "text": "    }"
            },
            {
              "n": 63,
              "type": "context",
              "text": ""
            },
            {
              "n": 64,
              "type": "context",
              "text": "    try {"
            },
            {
              "n": 65,
              "type": "context",
              "text": "      if (rule.when && !evaluateCondition(rule.when, context)) {"
            },
            {
              "n": 66,
              "type": "context",
              "text": "        continue"
            },
            {
              "n": 67,
              "type": "context",
              "text": "      }"
            },
            {
              "n": 68,
              "type": "context",
              "text": "      const value = resolveValue(rule.value, context)"
            },
            {
              "n": 69,
              "type": "context",
              "text": "      if (value !== undefined) {"
            },
            {
              "n": 70,
              "type": "context",
              "text": "        context.output[rule.target] = value"
            },
            {
              "n": 71,
              "type": "context",
              "text": "      }"
            },
            {
              "n": 72,
              "type": "context",
              "text": "    } catch (error) {"
            },
            {
              "n": 73,
              "type": "context",
              "text": "      throw new Error("
            },
            {
              "n": 74,
              "type": "context",
              "text": "        `Mapping \"${mapping.id}\" rule \"${rule.id}\" failed: ${"
            },
            {
              "n": 75,
              "type": "context",
              "text": "          error instanceof Error ? error.message : String(error)"
            },
            {
              "n": 76,
              "type": "context",
              "text": "        }`,"
            },
            {
              "n": 77,
              "type": "context",
              "text": "        { cause: error }"
            },
            {
              "n": 78,
              "type": "context",
              "text": "      )"
            },
            {
              "n": 79,
              "type": "context",
              "text": "    }"
            },
            {
              "n": 80,
              "type": "context",
              "text": "  }"
            },
            {
              "n": 81,
              "type": "context",
              "text": ""
            },
            {
              "n": 82,
              "type": "context",
              "text": "  return context.output"
            },
            {
              "n": 83,
              "type": "context",
              "text": "}"
            }
          ]
        },
        {
          "id": "blk-engine-expansion",
          "file": "src/service/rule-mapping/engine.js",
          "language": "javascript",
          "lines": [
            {
              "n": 85,
              "type": "added",
              "text": "/**"
            },
            {
              "n": 86,
              "type": "added",
              "text": " * Resolves a mapping's \"expand\" block into one overlay per repeater entry."
            },
            {
              "n": 87,
              "type": "added",
              "text": " *"
            },
            {
              "n": 88,
              "type": "added",
              "text": " * Each overlay is merged over the base payload to produce one submission. An"
            },
            {
              "n": 89,
              "type": "added",
              "text": " * empty array means no fan-out: either the mapping declares no expansion, or"
            },
            {
              "n": 90,
              "type": "added",
              "text": " * the repeater held no usable entries, in which case the base payload stands on"
            },
            {
              "n": 91,
              "type": "added",
              "text": " * its own."
            },
            {
              "n": 92,
              "type": "added",
              "text": " * @param {MappingDefinition} mapping - The mapping definition"
            },
            {
              "n": 93,
              "type": "added",
              "text": " * @param {FormAdapterSubmissionMessage} message - The form submission message"
            },
            {
              "n": 94,
              "type": "added",
              "text": " * @returns {Array<Record<string, unknown>>} One overlay per expanded submission"
            },
            {
              "n": 95,
              "type": "added",
              "text": " */"
            },
            {
              "n": 96,
              "type": "added",
              "text": "export function resolveExpansion(mapping, message) {"
            },
            {
              "n": 97,
              "type": "added",
              "text": "  const expansion = mapping.expand"
            },
            {
              "n": 98,
              "type": "added",
              "text": "  if (!expansion) {"
            },
            {
              "n": 99,
              "type": "added",
              "text": "    return []"
            },
            {
              "n": 100,
              "type": "added",
              "text": "  }"
            },
            {
              "n": 101,
              "type": "added",
              "text": ""
            },
            {
              "n": 102,
              "type": "added",
              "text": "  const context = buildContext(mapping, message)"
            },
            {
              "n": 103,
              "type": "added",
              "text": "  const { filterAnswered } = expansion"
            },
            {
              "n": 104,
              "type": "added",
              "text": ""
            },
            {
              "n": 105,
              "type": "added",
              "text": "  let entries = readEntries(expansion.repeater, context)"
            },
            {
              "n": 106,
              "type": "added",
              "text": "  if (filterAnswered) {"
            },
            {
              "n": 107,
              "type": "added",
              "text": "    entries = entries.filter((entry) => !isEmpty(entry[filterAnswered]))"
            },
            {
              "n": 108,
              "type": "added",
              "text": "  }"
            },
            {
              "n": 109,
              "type": "added",
              "text": ""
            },
            {
              "n": 110,
              "type": "added",
              "text": "  return entries.map((entry, index) => {"
            },
            {
              "n": 111,
              "type": "added",
              "text": "    /** @type {MappingContext} */"
            },
            {
              "n": 112,
              "type": "added",
              "text": "    const entryContext = {"
            },
            {
              "n": 113,
              "type": "added",
              "text": "      ...context,"
            },
            {
              "n": 114,
              "type": "added",
              "text": "      item: entry,"
            },
            {
              "n": 115,
              "type": "added",
              "text": "      itemIndex: index + 1,"
            },
            {
              "n": 116,
              "type": "added",
              "text": "      itemCount: entries.length"
            },
            {
              "n": 117,
              "type": "added",
              "text": "    }"
            },
            {
              "n": 118,
              "type": "added",
              "text": ""
            },
            {
              "n": 119,
              "type": "added",
              "text": "    /** @type {Record<string, unknown>} */"
            },
            {
              "n": 120,
              "type": "added",

          "lines": [

              "text": "/**"
