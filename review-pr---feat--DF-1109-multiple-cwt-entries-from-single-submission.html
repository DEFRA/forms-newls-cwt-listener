            {
              "n": 38,
              "type": "added",
              "text": " * Back-off delay for the given attempt, with jitter."
            },
            {
              "n": 39,
              "type": "added",
              "text": " *"
            },
            {
              "n": 40,
              "type": "added",
              "text": " * Jitter matters because a batch of queue messages is handled concurrently:"
            },
            {
              "n": 41,
              "type": "added",
              "text": " * without it, a destination that just rejected several sends would receive"
            },
            {
              "n": 42,
              "type": "added",
              "text": " * every retry at the same instant."
            },
            {
              "n": 43,
              "type": "added",
              "text": " * @param {number} attempt - 1-based number of the attempt that just failed"
            },
            {
              "n": 44,
              "type": "added",
              "text": " * @param {Required<Pick<RetryOptions, 'initialDelayMs' | 'maxDelayMs' | 'factor'>>} options"
            },
            {
              "n": 45,
              "type": "added",
              "text": " * @returns {number}"
            },
            {
              "n": 46,
              "type": "added",
              "text": " */"
            },
            {
              "n": 47,
              "type": "added",
              "text": "function backOffDelay(attempt, options) {"
            },
            {
              "n": 48,
              "type": "added",
              "text": "  const exponential = options.initialDelayMs * options.factor ** (attempt - 1)"
            },
            {
              "n": 49,
              "type": "added",
              "text": "  const capped = Math.min(exponential, options.maxDelayMs)"
            },
            {
              "n": 50,
              "type": "added",
              "text": "  return Math.round(capped * (JITTER_FLOOR + Math.random() * JITTER_FLOOR))"
            },
            {
              "n": 51,
              "type": "added",
              "text": "}"
            },
            {
              "n": 52,
              "type": "added",
              "text": ""
            },
            {
              "n": 53,
              "type": "added",
              "text": "/**"
            },
            {
              "n": 54,
              "type": "added",
              "text": " * Runs an operation, retrying transient failures with exponential back-off."
            },
            {
              "n": 55,
              "type": "added",
              "text": " *"
            },
            {
              "n": 56,
              "type": "added",
              "text": " * The error from the final attempt is thrown; earlier errors are logged. An"
            },

              "n": 59,
              "type": "added",

              "n": 60,
              "type": "added",

              "n": 61,

            },
            {
              "n": 62,
              "type": "added",
              "text": " * @returns {Promise<T>}"
            },
            {
              "n": 63,
              "type": "added",
              "text": " */"
            },
            {
              "n": 64,
              "type": "added",
              "text": "export async function withRetry(operation, options = {}) {"
            },
            {
              "n": 65,
              "type": "added",
              "text": "  const maxAttempts = options.maxAttempts ?? DEFAULT_MAX_ATTEMPTS"
            },
            {
              "n": 66,
              "type": "added",
              "text": "  const initialDelayMs = options.initialDelayMs ?? DEFAULT_INITIAL_DELAY_MS"

            {
              "n": 67,
              "type": "added",
              "text": "  const maxDelayMs = options.maxDelayMs ?? DEFAULT_MAX_DELAY_MS"
            },
            {
              "n": 68,
              "type": "added",
              "text": "  const factor = options.factor ?? DEFAULT_FACTOR"
            },
            {
              "n": 69,
              "type": "added",
              "text": "  const shouldRetry = options.shouldRetry ?? (() => true)"

              "type": "added",
              "text": "  const description = options.description ?? 'operation'"
            },
            {
              "n": 71,
              "type": "added",
              "text": ""
            },
            {
              "n": 72,
              "type": "added",
              "text": "  for (let attempt = 1; ; attempt++) {"

              "n": 73,
              "type": "added",
              "text": "    try {"

              "n": 74,

            },

    "findings": [
      {
        "severity": "major",
        "title": "Lost payloads are logged in full at error level — personal data lands in the logs",
        "file": "src/service/submission-handler.js",
        "line": 110,
        "blockId": "blk-send-any",
        "bodyHtml": "In <code>any<\/code> mode a partial failure logs every failed payload via <code>JSON.stringify(payload)<\/code>. These payloads carry personal data (customer and represented-body names, contact details), and error-level log lines typically ship to centralised logging with broad access and long retention — a wider audience than the destination system itself. The intent (this is the only record of a lost submission) is sound, but consider logging the <code>DF_reference_number<\/code> plus the differing overlay keys only, or emitting the full payload to a restricted dead-letter store rather than the application log."
      },
      {
        "severity": "minor",
        "title": "Expansion targets silently cannot see the base payload",
        "file": "src/service/rule-mapping/engine.js",
        "line": 102,
        "blockId": "blk-engine-expansion",
        "bodyHtml": "<code>resolveExpansion<\/code> builds a fresh context whose <code>output<\/code> is empty, so an <code>output<\/code>-type value expression inside <code>expand.targets<\/code> resolves to <code>undefined<\/code> and is quietly dropped from the overlay — the base value wins with no hint that the expression did nothing. Either thread the base payload's outputs into the expansion context, or reject <code>output<\/code> expressions inside <code>expand.targets<\/code> the way <code>expansionIndex<\/code> rejects use <em>outside<\/em> them."
      },
      {
        "severity": "minor",
        "title": "Destination health probes have no timeout",
        "file": "src/routes/health.js",
        "line": 25,
        "blockId": "blk-health",
        "bodyHtml": "<code>checkDestination<\/code> fetches with no <code>AbortSignal<\/code>, and the handler awaits <code>Promise.all<\/code> over every destination — one hanging destination holds <code>/health<\/code> open until the platform's probe gives up, which can flap the container. Pre-existing behaviour, but now multiplied per destination. <code>fetch(url, { signal: AbortSignal.timeout(5000) })<\/code> would bound it."
      },
      {
        "severity": "minor",
        "title": "filterAnswered escapes gap detection",
        "file": "src/service/rule-mapping/mapping-schema.js",
        "line": 126,
        "blockId": "blk-schema-expansion",
        "bodyHtml": "<code>filterAnswered<\/code> is a bare question id string (<code>\"BKoVeV\"<\/code> in the consent mapping). <code>collectMappingReferences<\/code> only recognises <code>question<\/code>/<code>questionId<\/code> shapes, so if that question is renamed or removed in the form, gap detection won't flag it — entries would stop matching and the fan-out would silently disappear (base payload only). Making it a question ref (<code>{ id, text }<\/code>) would bring it under the existing checks."
      },
      {
        "severity": "suggestion",
        "title": "'all' mode duplicates already-delivered payloads on redelivery",
        "file": "src/service/rule-mapping/types.js",
        "line": 175,
        "blockId": "blk-types-expansion",
        "bodyHtml": "The trade-off is honestly documented (redelivery re-sends the whole set), and the consent mapping avoids it by using <code>any<\/code>. If a future mapping does use <code>all<\/code>, CWT-side idempotency (e.g. a per-payload dedupe key of reference number + entry index — <code>expansionIndex<\/code> already exists) would close the gap."
      },
      {
        "severity": "suggestion",
        "title": "Empty api-key header sent when no key is configured",
        "file": "src/service/transmitters/handlers/json-form-data.js",
        "line": 25,
        "blockId": "blk-handler-jfd",
        "bodyHtml": "<code>authHeaders<\/code> returns <code>{ 'api-key': '' }<\/code> for a null key. Omitting the header entirely would make a misconfigured credential fail loudly at the destination rather than look like an authenticated-but-wrong request."
      },
      {
        "severity": "suggestion",
        "title": "Concurrent fan-out multiplies retry pressure on the destination",
        "file": "src/service/submission-handler.js",
        "line": 85,
        "blockId": "blk-send-any",
        "bodyHtml": "<code>any<\/code> mode fires all payloads concurrently via <code>Promise.allSettled<\/code>, each with its own retry loop — a 429 from CWT triggers up to five parallel back-off sequences (the jitter in <code>backOffDelay<\/code> helps). With a five-entry cap this is fine; if the cap grows, consider sending sequentially or sharing a limiter."
      }
    ],
